<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trigonometry Practice Lab</title><style>body{font-family:system-ui,Arial;background:#f4f7fb;color:#162337;margin:0}main{max-width:850px;margin:35px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 8px 30px #172b4d12}h1{margin:0;color:#134e5e}.sub{color:#617286}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{font:inherit;padding:11px;border:1px solid #b7c5d3;border-radius:9px}input,select{width:100%;box-sizing:border-box}button{background:#087e83;color:white;border:0;cursor:pointer;margin:7px 6px 7px 0}button.secondary{background:#e6f2f2;color:#17585a}button:disabled{opacity:.5;cursor:default}.panel{padding:18px;background:#f5f9fc;border-radius:12px;margin-top:18px}.graphbox{background:white;border:1px solid #d9e4ed;border-radius:12px;padding:10px;margin:12px 0}.graphbox svg{width:100%;height:auto}.math{font-family:Georgia,serif}.question{font-size:1.35rem;font-weight:650;margin:20px 0}#feedback{white-space:pre-wrap;line-height:1.5}.good{color:#087347}.bad{color:#a03b35}small{color:#627285}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}@media print{button,.controls{display:none!important}main{box-shadow:none;margin:0}}</style></head><body><main><h1>Trigonometry Practice Lab</h1><p class="sub">Precalculus · Exact values · Radians · Visual graph analysis · Instant feedback</p><div class="controls"><label for="student">Student name</label><input id="student" placeholder="Enter your name"><label for="module">Practice module</label><select id="module"><option value="values">Level 1 · Unit Circle & Exact Values</option><option value="inverse">Level 1 · Inverse Trigonometric Functions</option><option value="equations">Level 1 · Trigonometric Equations</option><option value="graphs">Level 1 · Graph Analysis (Visual)</option><option value="identities">Level 2 · Trigonometric Identities</option><option value="mixed">Mixed Practice · All Modules</option></select><label for="count">Questions per session</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><button onclick="start()">Start practice</button></div><section id="practice" class="panel" hidden><div id="progress"></div><div id="question" class="question math"></div><div id="graph" class="graphbox" hidden></div><label for="answer">Your answer (exact form)</label><input id="answer" autocomplete="off" placeholder="e.g. √3/2, −π/4, 2π/3"><small id="format">Graphs: read the curve without being shown its equation. Type exact answers using π, pi, fractions, or √. Separate multiple solutions with semicolons.</small><div><button id="check" onclick="check()">Check answer</button><button class="secondary" onclick="hint()">Hint</button><button id="next" onclick="next()" hidden>Next question</button></div><div id="feedback" aria-live="polite"></div></section><section id="report" class="panel" hidden></section></main><script>
const $=id=>document.getElementById(id);
function pretty(t){return String(t).replace(/sqrt\(3\)/g,'√3').replace(/sqrt\(2\)/g,'√2').replace(/pi/g,'π').replace(/\b(arcsin|arccos|arctan)\b/g, m=>({arcsin:'sin⁻¹',arccos:'cos⁻¹',arctan:'tan⁻¹'}[m])).replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/<=/g,'≤').replace(/>=/g,'≥');}
function exact(v){if(v===null)return 'undefined';if(Math.abs(v)<1e-7)return '0';let candidates=[['1/2',.5],['-1/2',-.5],['√2/2',Math.SQRT1_2],['-√2/2',-Math.SQRT1_2],['√3/2',Math.sqrt(3)/2],['-√3/2',-Math.sqrt(3)/2],['√3',Math.sqrt(3)],['-√3',-Math.sqrt(3)],['√3/3',Math.sqrt(3)/3],['-√3/3',-Math.sqrt(3)/3],['2√3/3',2*Math.sqrt(3)/3],['-2√3/3',-2*Math.sqrt(3)/3],['2√3',2*Math.sqrt(3)],['-2√3',-2*Math.sqrt(3)]];for(let [t,n] of candidates)if(Math.abs(v-n)<1e-6)return t;for(let d=1;d<=12;d++)for(let n=-24;n<=24;n++)if(Math.abs(v-n*Math.PI/d)<1e-6){if(n===0)return '0';let gcd=(a,b)=>b?gcd(b,a%b):a;let g=gcd(Math.abs(n),d),a=n/g,b=d/g;return (a===1?'':a===-1?'−':a+'')+'π'+(b===1?'':'/'+b)}return String(v)}
function drawGraph(q){
 let el=$('graph');el.hidden=!q.graph;if(!q.graph){el.innerHTML='';return}
 let {A,B,C,fn,shift=0}=q.graph,W=720,H=340,l=55,r=22,t=22,b=54,xMax=2*Math.PI;
 let yMin=Math.min(-4,C-A-0.8),yMax=Math.max(4,C+A+0.8);
 let X=x=>l+x/xMax*(W-l-r),Y=y=>t+(yMax-y)/(yMax-yMin)*(H-t-b);
 let lines='';for(let i=Math.ceil(yMin);i<=Math.floor(yMax);i++){
  lines+=`<line x1="${l}" y1="${Y(i)}" x2="${W-r}" y2="${Y(i)}" stroke="${i===0?'#66788b':'#e6edf3'}" stroke-width="${i===0?1.5:1}"/><text x="${l-11}" y="${Y(i)+4}" font-size="12" text-anchor="end" fill="#506278">${i}</text>`;
 }
 for(let i=0;i<=8;i++){let x=i*Math.PI/4;let labels=['0','π/4','π/2','3π/4','π','5π/4','3π/2','7π/4','2π'];lines+=`<line x1="${X(x)}" y1="${t}" x2="${X(x)}" y2="${H-b}" stroke="#e6edf3"/><text x="${X(x)}" y="${H-b+22}" text-anchor="middle" font-size="12" fill="#40566c">${labels[i]}</text>`}
 let d='';for(let i=0;i<=900;i++){let x=xMax*i/900,y=A*Math[fn](B*(x-shift))+C;d+=(i?'L':'M')+X(x).toFixed(2)+','+Y(y).toFixed(2)+' '}
 let mid=`<line x1="${l}" y1="${Y(C)}" x2="${W-r}" y2="${Y(C)}" stroke="#b7791f" stroke-width="1.3" stroke-dasharray="6 6" opacity=".8"/>`;
 el.innerHTML=`<div style="font-weight:650;margin:2px 0 9px">Analyze the graph below (equation hidden)</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trigonometric curve with horizontal axis labeled in multiples of pi and vertical numeric axis">${lines}${mid}<line x1="${l}" y1="${t}" x2="${l}" y2="${H-b}" stroke="#526579" stroke-width="1.5"/><path d="${d}" stroke="#087e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="${W-8}" y="${H-b-10}" text-anchor="end" fill="#526579">x</text><text x="${l+8}" y="${t+5}" fill="#526579">y</text></svg><small>0 ≤ x ≤ 2π · radians · Dashed gold line indicates the midline.</small>`;
}
const PI=Math.PI;let session=[],index=0,records=[],attempted=false,shownHint=false;
const choices=[{a:'0',v:0},{a:'pi/6',v:PI/6},{a:'pi/4',v:PI/4},{a:'pi/3',v:PI/3},{a:'pi/2',v:PI/2},{a:'2pi/3',v:2*PI/3},{a:'3pi/4',v:3*PI/4},{a:'5pi/6',v:5*PI/6},{a:'pi',v:PI},{a:'7pi/6',v:7*PI/6},{a:'5pi/4',v:5*PI/4},{a:'4pi/3',v:4*PI/3},{a:'3pi/2',v:3*PI/2},{a:'5pi/3',v:5*PI/3},{a:'7pi/4',v:7*PI/4},{a:'11pi/6',v:11*PI/6}];
const pick=a=>a[Math.floor(Math.random()*a.length)];const fmt=n=>Math.abs(n)<1e-10?0:Number(n.toFixed(9));
function val(fn,x){let v=Math[fn](x);if(fn==='tan'&&Math.abs(Math.cos(x))<1e-8)return null;if(fn==='sin'&&Math.abs(Math.sin(x))<1e-8)return 0;if(fn==='cos'&&Math.abs(Math.cos(x))<1e-8)return 0;return fmt(v)}
function num(s){s=s.toLowerCase().replace(/π/g,'pi').replace(/√(?=\d)/g,'sqrt').replace(/\s+/g,'').replace(/−/g,'-');if(!/^[0-9a-z+*/().-]+$/.test(s)||!s)return NaN;s=s.replace(/(\d)(pi|sqrt|\()/g,'$1*$2').replace(/(\d)(√)/g,'$1*$2').replace(/pi(?=\d)/g,'pi*').replace(/pi/g,'('+PI+')').replace(/sqrt\(/g,'Math.sqrt(');if(!/^[0-9+*/().\-Mathsqrt]+$/.test(s))return NaN;try{let z=Function('return ('+s+')')();return typeof z==='number'&&Number.isFinite(z)?z:NaN}catch{return NaN}}
function qValues(){let angle=pick(choices),fn=pick(['sin','cos','tan','sec','csc','cot']);let base=val(fn==='sec'?'cos':fn==='csc'?'sin':fn==='cot'?'tan':fn,angle.v);let target=(fn==='sec'||fn==='csc'||fn==='cot')?(base===null||Math.abs(base)<1e-8?null:fmt(1/base)):base;return {topic:'Unit Circle & Exact Values',text:`Evaluate ${fn}(${angle.a}). Give an exact value or write undefined.`,target,kind:'number',hint:'Use the reference angle and the signs in the corresponding quadrant.',explain:`${fn}(${angle.a}) = ${exact(target)}. Use the unit circle and reciprocal identities where appropriate.`}}
function qInverse(){let fn=pick(['arcsin','arccos','arctan']);let a=pick(choices);let x=fn==='arcsin'?val('sin',a.v):fn==='arccos'?val('cos',a.v):val('tan',a.v);if(x===null)return qInverse();let target=fn==='arcsin'?Math.asin(x):fn==='arccos'?Math.acos(x):Math.atan(x);return {topic:'Inverse Trigonometric Functions',text:`Evaluate ${fn}(${exact(x)}). Give the principal value in radians.`,target:fmt(target),kind:'number',hint:fn==='arcsin'?'The principal-value range of arcsin is [-pi/2, pi/2].':fn==='arccos'?'The principal-value range of arccos is [0, pi].':'The principal-value range of arctan is (-pi/2, pi/2).',explain:`The principal value is ${exact(target)} radians. Check the restricted range of ${fn}.`}}
function qEquations(){let fn=pick(['sin','cos','tan']);let a=pick(choices),target=val(fn,a.v);if(target===null)return qEquations();let solutions=choices.filter(z=>{let v=val(fn,z.v);return v!==null&&Math.abs(v-target)<1e-7}).map(z=>z.v);return {topic:'Trigonometric Equations',text:`Solve ${fn}(x) = ${exact(target)} for 0 ≤ x < 2pi. List ALL solutions separated by semicolons.`,target:solutions,kind:'set',hint:'Use the unit circle and check every quadrant in the specified interval.',explain:'Solutions: '+choices.filter(z=>solutions.some(s=>Math.abs(s-z.v)<1e-7)).map(z=>z.a).join('; ')}}
function qGraphs(){
 let A=pick([1,2,3]),B=pick([1,2,3,4]),C=pick([-2,-1,0,1,2]),fn=pick(['sin','cos']);
 let type=pick(['amplitude','period','vertical shift','frequency','function']);
 let target=type==='amplitude'?A:type==='period'?2*PI/B:type==='vertical shift'?C:type==='frequency'?B:fn;
 let instruction={amplitude:'Determine the amplitude.',period:'Determine the period. Answer in radians.','vertical shift':'Determine the vertical shift (signed number).',frequency:'How many complete cycles occur between 0 and 2π?',function:'Does the curve have the basic sine or cosine shape at x = 0? Type sin or cos.'}[type];
 let explanation={amplitude:`Amplitude = (maximum − minimum) / 2 = ${A}.`,period:`Period = 2π / ${B} = ${exact(2*PI/B)}.`, 'vertical shift':`The dashed midline is y = ${C}, so the vertical shift is ${C}.`,frequency:`The graph completes ${B} full cycle(s) on 0 ≤ x ≤ 2π.`,function:`At x = 0, the curve ${fn==='sin'?'crosses its midline moving upward':'starts at its maximum'}, matching a ${fn} curve.`}[type];
 return {topic:'Graphs & Transformations',graph:{A,B,C,fn},text:instruction,target,kind:type==='function'?'symbolic':'number',hint:type==='amplitude'?'Compare the highest and lowest points.':type==='period'?'Measure the horizontal distance between consecutive peaks.':type==='vertical shift'?'Locate the dashed midline.':type==='frequency'?'Count complete repeated waves from 0 to 2π.':'Observe the curve at x = 0 relative to its midline.',explain:explanation};
}
const identities=[{text:'Simplify (1 - cos(x)^2) / sin(x). Assume the expression is defined.',answer:'sin(x)',hint:'Use the Pythagorean identity.',explain:'1 - cos²(x) = sin²(x), so the expression simplifies to sin(x).'},{text:'Simplify sin(x) / cos(x). Assume cos(x) ≠ 0.',answer:'tan(x)',hint:'Recall the quotient identities.',explain:'sin(x)/cos(x) = tan(x).'},{text:'Simplify sec(x)^2 - tan(x)^2.',answer:'1',hint:'Use a Pythagorean identity involving secant.',explain:'sec²(x) - tan²(x) = 1.'},{text:'Simplify (1 - sin(x)^2) / cos(x). Assume the expression is defined.',answer:'cos(x)',hint:'Use the Pythagorean identity.',explain:'1 - sin²(x) = cos²(x), then divide by cos(x).'},{text:'Simplify 1 / sec(x). Assume the expression is defined.',answer:'cos(x)',hint:'Use a reciprocal identity.',explain:'1/sec(x) = cos(x).'}];
function qIdentities(){let t=pick(identities);return {topic:'Trigonometric Identities',text:t.text,target:t.answer,kind:'symbolic',hint:t.hint,explain:t.explain}}
const makers={values:qValues,inverse:qInverse,equations:qEquations,graphs:qGraphs,identities:qIdentities};function start(){let m=$('module').value,n=+$('count').value;session=Array.from({length:n},(_,i)=>makers[m==='mixed'?Object.keys(makers)[i%5]:m]());index=0;records=[];$('report').hidden=true;$('practice').hidden=false;show()}
function show(){attempted=false;shownHint=false;let q=session[index];$('progress').textContent=`Question ${index+1} of ${session.length} · ${q.topic} · Score ${records.filter(r=>r.correct).length}`;$('question').textContent=pretty(q.text);drawGraph(q);$('answer').value='';$('feedback').textContent='';$('check').hidden=false;$('next').hidden=true;$('next').textContent=index===session.length-1?'Finish & View Report':'Next Question';$('answer').focus()}
function hint(){$('feedback').textContent=pretty('Hint: '+session[index].hint);shownHint=true}
function check(){if(attempted)return;let q=session[index],raw=$('answer').value.trim();if(!raw)return;let correct=false;if(q.kind==='symbolic'){let a=raw.toLowerCase().replace(/\s+/g,'').replace(/\*/g,'');let b=q.target.toLowerCase();correct=a===b||q.target==='1'&&Math.abs(num(raw)-1)<1e-7}else if(q.kind==='set'){let values=raw.split(/[;,]/).map(num);correct=values.length===q.target.length&&values.every(Number.isFinite)&&values.every(v=>q.target.some(t=>Math.abs(v-t)<1e-6))&&q.target.every(t=>values.some(v=>Math.abs(v-t)<1e-6))}else if(q.target===null){correct=/^(undefined|doesnotexist|dne)$/i.test(raw.replace(/\s/g,''))}else{let v=num(raw);correct=Number.isFinite(v)&&Math.abs(v-q.target)<1e-6}attempted=true;records.push({topic:q.topic,question:q.text,answer:raw,correct,hint:shownHint});$('feedback').className=correct?'good':'bad';$('feedback').textContent=(correct?'✓ Correct!':'✗ Not quite. Review the explanation.')+'\n'+pretty(q.explain);$('check').hidden=true;$('next').hidden=false}
function next(){if(index<session.length-1){index++;show()}else finish()}
function finish(){let correct=records.filter(r=>r.correct).length,n=records.length;let name=$('student').value.trim()||'Student';$('practice').hidden=true;$('report').hidden=false;let topics=[...new Set(records.map(r=>r.topic))];let weak=topics.filter(t=>records.some(r=>r.topic===t&&!r.correct));$('report').innerHTML='<h2>Practice Report</h2><p><b>Student:</b> '+escapeHtml(name)+'</p><p><b>Score:</b> '+correct+' / '+n+' ('+Math.round(100*correct/n)+'%)</p><p><b>Topics to review:</b> '+(weak.map(escapeHtml).join(', ')||'None in this session')+'</p><table><thead><tr><th>Topic</th><th>Result</th></tr></thead><tbody>'+records.map(r=>'<tr><td>'+escapeHtml(r.topic)+'</td><td>'+(r.correct?'Correct':'Needs review')+'</td></tr>').join('')+'</tbody></table><button onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="start()">Practice Again</button>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!attempted)check();else next()}});
</script></body></html>
